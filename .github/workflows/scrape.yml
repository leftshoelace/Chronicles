name: apartment-scrape

on:
  schedule:
    # Every 10 minutes. GitHub Actions' scheduled cron has a 5-minute minimum
    # and is regularly delayed 5-20 min under load, so real cadence is closer
    # to 15-30 min. That's acceptable given that email delivery from StreetEasy
    # et al. dominates the end-to-end latency anyway.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: apartment-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/apartment-search-scraper-8p5mH
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Commit updated dedupe DB
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update seen.sqlite3 [skip ci]"
            git push origin HEAD:claude/apartment-search-scraper-8p5mH
          fi
